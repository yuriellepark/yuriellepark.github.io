<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Quiet Pencil — Yurielle Jua Park</title>
<meta name="description" content="Read A Quiet Pencil, a hundred-day illustrated poetry project by Yurielle Jua Park.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='25' font-size='24'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
</head>
<body class="reader">

<div class="grain" aria-hidden="true"></div>
<div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
<div id="cursor" aria-hidden="true"></div>

<div class="reader-shell">

  <div class="reader-bar">
    <a class="icon-btn" href="index.html" aria-label="Back to portfolio">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <p class="t">A Quiet <em>Pencil</em></p>
    <div class="rb-actions">
      <button class="icon-btn" id="btnThumbs" aria-pressed="false" aria-label="Page index" title="Page index">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      </button>
      <button class="icon-btn" id="btnFull" aria-pressed="false" aria-label="Full screen" title="Full screen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

  <div class="stage" id="stage">
    <button class="pager prev" id="prev" aria-label="Previous page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div class="book" id="book">
      <div class="book-shadow" aria-hidden="true"></div>
    </div>

    <button class="pager next" id="next" aria-label="Next page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <p class="hint" id="hint">Click the page, swipe, or use ← →</p>
  </div>

  <div class="reader-foot">
    <div class="now">
      <p class="lbl" id="nowLbl">Cover</p>
      <p class="ttl" id="nowTtl">A Quiet Pencil</p>
    </div>
    <div class="track" id="track" role="slider" tabindex="0"
         aria-label="Page position" aria-valuemin="1" aria-valuemax="65" aria-valuenow="1">
      <i id="trackFill" style="width:0%"></i>
    </div>
    <p class="count" id="count">01 / 65</p>
  </div>
</div>

<div class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <span>All pages</span>
    <button id="btnClose" aria-label="Close index">Close ✕</button>
  </div>
  <div class="thumbs" id="thumbs"></div>
</div>

<script src="js/book-data.js"></script>
<script src="js/book.js"></script>
</body>
</html>
